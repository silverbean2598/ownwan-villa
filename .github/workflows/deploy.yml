name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npx wrangler d1 migrations apply ownwan-villa --remote
      - name: Ensure workers.dev subdomain
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if echo "$CUR" | grep -q '"subdomain":"[^"]'; then
            echo "workers.dev subdomain already set"
          else
            curl -s -X PUT "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" --data '{"subdomain":"ownwan-villa"}' | grep -o '"success":[a-z]*'
          fi
      - run: npm run deploy
