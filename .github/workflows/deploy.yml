name: deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # 배포가 겹치지 않게 한 번에 하나씩 (진행 중인 배포는 취소하지 않는다). PR 테스트는 막지 않도록 배포 잡에만 건다
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply ownwan-villa --remote
      - name: Ensure workers.dev subdomain
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -sS "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$CUR" | jq -e '.success == true' >/dev/null || { echo "subdomain lookup failed: $(echo "$CUR" | jq -c '.errors')"; exit 1; }
          if echo "$CUR" | jq -e '(.result.subdomain // "") != ""' >/dev/null; then
            echo "workers.dev subdomain already set"
          else
            RES=$(curl -sS -X PUT "$API" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" --data '{"subdomain":"ownwan-villa"}')
            echo "$RES" | jq -e '.success == true' >/dev/null || { echo "subdomain register failed: $(echo "$RES" | jq -c '.errors')"; exit 1; }
            echo "workers.dev subdomain registered"
          fi
      - run: npm run deploy
      # 카카오 로그인 키를 Worker secret 으로 넣는다. 값은 표준 입력으로만 넘기고 출력하지 않는다.
      # 비어 있으면 경고만 남기고 건너뛴다 (배포는 그대로, 앱은 "카카오 로그인을 준비 중이에요"로 안내)
      - name: Push Kakao secrets
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for NAME in KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET; do
            if [ -z "${!NAME:-}" ]; then
              echo "::warning::$NAME 이(가) 비어 있어 건너뛰어요. 카카오 로그인은 '준비 중'으로 보여요"
              continue
            fi
            printf %s "${!NAME}" | npx wrangler secret put "$NAME"
          done
