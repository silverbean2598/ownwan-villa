name: android
# 플레이스토어용 안드로이드 앱(TWA) 빌드.
# - PR에서 android/ 가 바뀌면: 서명 없이 빌드만 해서 깨지지 않았는지 확인한다.
# - Actions 탭 → "android" → Run workflow: 업로드 키로 서명한 AAB를 만들어 아티팩트로 올린다 (Play Console에 올릴 파일).
#   필요한 저장소 Secret: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD (docs/android-release.md)
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: "버전 코드 (올릴 때마다 1씩 올리기. 비우면 android/app/build.gradle 값 그대로)"
        required: false
        default: ""
      version_name:
        description: "버전 이름 (예: 1.0.1. 비우면 그대로)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_CODE" ]; then
            [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "::error::버전 코드는 숫자만"; exit 1; }
            sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/" app/build.gradle
          fi
          if [ -n "$VERSION_NAME" ]; then
            [[ "$VERSION_NAME" =~ ^[0-9A-Za-z.\-]+$ ]] || { echo "::error::버전 이름은 숫자·영문·점·하이픈만"; exit 1; }
            sed -i -E "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          fi
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build release bundle (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease

      # 서명은 Run workflow 로 돌릴 때만. 키는 Secret 에서 임시 파일로 풀고, 끝나면 지운다. 비밀번호는 출력하지 않는다
      - name: Sign with upload key
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 / ANDROID_UPLOAD_KEYSTORE_PASSWORD Secret 이 없어요 (docs/android-release.md)"
            exit 1
          fi
          KS="$RUNNER_TEMP/upload-key.jks"
          printf %s "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KS"
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$KS" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" upload
          jarsigner -verify "$AAB" | tail -1
          rm -f "$KS"
          CODE=$(grep -oE "versionCode [0-9]+" app/build.gradle | grep -oE "[0-9]+")
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$AAB" "$GITHUB_WORKSPACE/out/ownwan-villa-v$CODE.aab"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ownwan-villa-aab
          path: out/*.aab
          retention-days: 7
